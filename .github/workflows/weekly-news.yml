name: Weekly News Digest

on:
  schedule:
    - cron: "0 18 * * 5" # 18:00 UTC (1 PM EST) every Friday
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # PaperMod theme

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Fetch RSS feeds (top up the daily buffer)
        run: uv run news-aggregator

      - name: Generate digest with OpenRouter
        id: digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }} # optional repo variable; defaults in digest.py
        run: uv run news-digest

      - name: Prune posts older than 90 days
        run: |
          cutoff=$(date -d "90 days ago" +%Y-%m-%d)
          for f in content/posts/[0-9]*.md; do
            [ -f "$f" ] || continue
            fname=$(basename "${f%.*}")
            if [ "$fname" \< "$cutoff" ]; then
              rm "$f"
            fi
          done

      - name: Commit digest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: weekly news digest"
          file_pattern: "content/posts/*.md reports/seen.json reports/pending.json data/costs.json"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.0"
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TITLE: "Weekly News Digest — ${{ job.status == 'success' && 'Completed' || 'Failed' }}"
          TAGS: ${{ job.status == 'success' && 'white_check_mark' || 'x' }}
          CLICK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY: ${{ steps.digest.outputs.cost_line }}
        run: |
          curl \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Click: $CLICK" \
            -d "$BODY" \
            "$NTFY_URL"
